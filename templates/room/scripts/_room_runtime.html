<script>
function fallbackCopyRoomLink(value) {
    const textarea = document.createElement("textarea");
    textarea.value = value;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();
    const copied = document.execCommand("copy");
    textarea.remove();
    return copied;
}

async function copySharedRoomLink() {
    const button = document.getElementById("copyRoomShareLink");
    const status = document.getElementById("roomShareStatus");
    if (!button) return;

    const shareUrl = new URL(button.dataset.sharePath, window.location.origin).toString();
    let copied = false;
    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(shareUrl);
            copied = true;
        } else {
            copied = fallbackCopyRoomLink(shareUrl);
        }
    } catch (error) {
        copied = fallbackCopyRoomLink(shareUrl);
    }

    const strong = button.querySelector("strong");
    const small = button.querySelector("small");
    if (copied) {
        button.classList.add("is-copied");
        if (strong) strong.textContent = "Đã copy link";
        if (small) small.textContent = "Gửi link này cho đối thủ";
        if (status) status.textContent = "Đã sao chép link phòng đấu.";
        window.setTimeout(function () {
            button.classList.remove("is-copied");
            if (strong) strong.textContent = "Chia sẻ phòng";
            if (small) small.textContent = "Copy link tham gia";
            if (status) status.textContent = "";
        }, 3500);
    } else {
        if (status) status.textContent = "Không thể tự copy. Hãy sao chép link trên thanh địa chỉ.";
        window.prompt("Copy link phòng đấu:", shareUrl);
    }
}

function bindRoomShareButton() {
    const shareButton = document.getElementById("copyRoomShareLink");
    if (!shareButton || shareButton.dataset.roomShareBound === "1") return;
    shareButton.dataset.roomShareBound = "1";
    shareButton.addEventListener("click", copySharedRoomLink);
}

let currentRoomStateKey = {{ initial_room_state_key|tojson }};
let currentRoomStatus = {{ room.status|tojson }};
let currentRoomMode = {{ selected_rank_mode|tojson }};
let currentSeriesPhase = {{ (rank_series.phase if rank_series else '')|tojson }};
const currentRoomUserIsHost = {{ (room_room_viewer_is_host or current_user.role == 'admin')|tojson }};
const currentRoomUserIsGuest = {{ (room_viewer_is_guest)|tojson }};
const currentRoomPath = {{ url_for('room_detail', room_id=room.id)|tojson }};

let roomCountdownSeconds = 0;
let roomStartCountdownSeconds = 0;
let roomStartCountdownMode = "down";
let roomCountdownTimer = null;

function renderRoomCountdown(seconds) {
    const countdown = document.getElementById("roomCountdown");
    if (!countdown) return;
    const safeSeconds = Math.max(0, Number(seconds) || 0);
    const minutes = Math.floor(safeSeconds / 60);
    const remain = Math.floor(safeSeconds % 60);
    countdown.textContent = String(minutes).padStart(2, "0") + ":" + String(remain).padStart(2, "0");
}

function renderRoomStartCountdown(seconds) {
    const countdown = document.getElementById("roomStartCountdown");
    if (!countdown) return;
    const safeSeconds = Math.max(0, Number(seconds) || 0);
    const minutes = Math.floor(safeSeconds / 60);
    const remain = Math.floor(safeSeconds % 60);
    countdown.textContent = String(minutes).padStart(2, "0") + ":" + String(remain).padStart(2, "0");
}

function syncRoomCountdownsFromDom() {
    const roomCountdown = document.getElementById("roomCountdown");
    const startCountdown = document.getElementById("roomStartCountdown");
    roomCountdownSeconds = Number(roomCountdown?.dataset.seconds || 0);
    roomStartCountdownSeconds = Number(startCountdown?.dataset.seconds || 0);
    roomStartCountdownMode = startCountdown?.dataset.mode || "down";
    renderRoomCountdown(roomCountdownSeconds);
    renderRoomStartCountdown(roomStartCountdownSeconds);
}

syncRoomCountdownsFromDom();
if (roomCountdownTimer) window.clearInterval(roomCountdownTimer);
roomCountdownTimer = window.setInterval(function () {
    if (roomCountdownSeconds > 0) roomCountdownSeconds -= 1;
    if (roomStartCountdownMode === "up") {
        roomStartCountdownSeconds += 1;
    } else if (roomStartCountdownSeconds > 0) {
        roomStartCountdownSeconds -= 1;
    }
    renderRoomCountdown(roomCountdownSeconds);
    renderRoomStartCountdown(roomStartCountdownSeconds);
}, 1000);

const roomScoreDraftKey = "pes-room-score-draft:{{ room.id }}";
let roomScoreFormDirty = false;
let roomScoreForm = null;
let roomScoreInputs = [];

function saveRoomScoreDraft() {
    if (!roomScoreInputs.length) return;
    roomScoreFormDirty = true;
    try {
        const draft = {};
        roomScoreInputs.forEach(function (input) { draft[input.name] = input.value; });
        sessionStorage.setItem(roomScoreDraftKey, JSON.stringify(draft));
    } catch (error) {}
}

function restoreRoomScoreDraft() {
    if (!roomScoreInputs.length) return;
    try {
        const raw = sessionStorage.getItem(roomScoreDraftKey);
        if (!raw) return;
        const draft = JSON.parse(raw);
        roomScoreInputs.forEach(function (input) {
            if (Object.prototype.hasOwnProperty.call(draft, input.name)) input.value = draft[input.name];
        });
        roomScoreFormDirty = true;
    } catch (error) {}
}

function clearRoomScoreDraft() {
    roomScoreFormDirty = false;
    try { sessionStorage.removeItem(roomScoreDraftKey); } catch (error) {}
}

function bindRoomScoreDraft() {
    roomScoreForm = document.querySelector(".room-score-form");
    roomScoreInputs = roomScoreForm
        ? Array.from(roomScoreForm.querySelectorAll('input[name="host_score"], input[name="guest_score"]'))
        : [];
    roomScoreInputs.forEach(function (input) {
        if (input.dataset.roomDraftBound === "1") return;
        input.dataset.roomDraftBound = "1";

        // Khi ô đang là 0, bấm/focus sẽ chọn toàn bộ để số mới thay thế 0.
        // Nhập 4 sẽ thành 4, không còn trường hợp 40.
        const selectDefaultScore = function () {
            if (String(input.value).trim() === "0") {
                window.requestAnimationFrame(function () { input.select(); });
            }
        };
        input.addEventListener("focus", selectDefaultScore);
        input.addEventListener("click", selectDefaultScore);
        input.addEventListener("mouseup", function (event) {
            if (String(input.value).trim() === "0") {
                event.preventDefault();
                input.select();
            }
        });
        input.addEventListener("wheel", function (event) {
            // Không cho con lăn chuột vô tình đổi tỷ số khi đang đặt chuột trên ô.
            if (document.activeElement === input) {
                event.preventDefault();
                input.blur();
            }
        }, { passive: false });
        input.addEventListener("input", function () {
            if (input.value !== "") {
                const score = Math.max(0, Math.min(99, Number.parseInt(input.value, 10) || 0));
                input.value = String(score);
            }
            saveRoomScoreDraft();
        });
    });
    restoreRoomScoreDraft();
}

let roomStateRequestInFlight = false;
let roomStateController = null;
let roomStateImmediateTimer = null;
let roomStateStopped = false;
let roomViewRefreshInFlight = false;
let roomActionRequestInFlight = false;

function getRoomStateInterval() {
    if (document.hidden) return 90000;
    if (currentRoomStatus === "playing") return currentRoomUserIsGuest ? 7000 : 12000;
    if (currentRoomStatus === "friendly_playing") return 15000;
    if (currentRoomStatus === "waiting_result_confirm") return currentRoomUserIsGuest ? 5000 : 8000;
    if (currentRoomStatus === "waiting_ready" && currentRoomMode === "ban_pick_bo3" && ["ban_pick", "ban", "pick"].includes(currentSeriesPhase)) return 3000;
    if (currentRoomStatus === "waiting_ready") return 8000;
    if (currentRoomStatus === "confirmed") return 8000;
    return 15000;
}

function shouldShowRoomAjaxNotice(flash) {
    if (!flash || !flash.message) return false;

    // Các bước thành công đã được phản ánh trực tiếp trên giao diện phòng.
    // Không mở modal lớn sau mỗi lần Sẵn Sàng, quay đội, nhập kết quả,
    // xác nhận hoặc Đá tiếp vì làm gián đoạn trải nghiệm người chơi.
    if (flash.tone === "success") return false;

    const normalized = String(flash.message || "")
        .trim()
        .toLocaleLowerCase("vi-VN");
    const quietRoomSteps = [
        "bạn đã chọn đá tiếp",
        "cả hai đã đồng ý đá tiếp",
        "đã nhập kết quả",
        "đang chờ người được mời xác nhận",
        "bạn đã sẵn sàng",
        "đã hủy trạng thái sẵn sàng",
        "đã tự random tiếp",
        "đã kết thúc giao hữu"
    ];
    return !quietRoomSteps.some(function (prefix) {
        return normalized.startsWith(prefix) || normalized.includes(prefix);
    });
}

function showRoomAjaxNotice(message, tone) {
    if (!message) return;
    if (window.PESRoomActionModal && typeof window.PESRoomActionModal.showNotice === "function") {
        window.PESRoomActionModal.showNotice({
            tone: tone || "warning",
            icon: tone === "danger" ? "⚠" : "ℹ",
            title: tone === "danger" ? "Không thể thực hiện" : "Thông báo phòng đấu",
            message: message,
            note: "PES ARENA",
            confirmLabel: "Đã hiểu"
        });
    }
}

function handleRoomSessionResponse(response) {
    if (!response) return false;
    const redirectedPath = response.redirected
        ? new URL(response.url, window.location.origin).pathname
        : "";
    if ([401, 403].includes(response.status) || redirectedPath === "/login") {
        stopRoomStatePolling();
        showRoomAjaxNotice("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.", "warning");
        window.setTimeout(function () {
            window.location.href = redirectedPath || "/login";
        }, 900);
        return true;
    }
    return false;
}

function getFlashFromDocument(doc) {
    const alert = doc.querySelector(".player-main > .alert, main .alert");
    if (!alert) return null;
    return {
        message: (alert.textContent || "").trim(),
        tone: alert.classList.contains("danger") ? "danger" : (alert.classList.contains("success") ? "success" : "warning")
    };
}

function bindSeriesTurnCountdown() {
    document.querySelectorAll(".series-turn-countdown").forEach(function (el) {
        if (el.dataset.bound === "1") return;
        el.dataset.bound = "1";
        let seconds = Math.max(0, Number(el.dataset.seconds || 0));
        el.textContent = String(seconds);
        const timer = window.setInterval(function () {
            if (!document.contains(el)) { window.clearInterval(timer); return; }
            if (seconds > 0) seconds -= 1;
            el.textContent = String(seconds);
            if (seconds <= 0) {
                window.clearInterval(timer);
                window.setTimeout(requestImmediateRoomStateCheck, 150);
            }
        }, 1000);
    });
}

function rebindRoomDynamicUi() {
    bindRoomShareButton();
    bindSeriesTurnCountdown();
    bindRoomScoreDraft();
    bindRoomAjaxForms();
    if (typeof bindRoomChatForm === "function") bindRoomChatForm();
    syncRoomCountdownsFromDom();
    if (window.PESRoomActionModal && typeof window.PESRoomActionModal.refreshForms === "function") {
        window.PESRoomActionModal.refreshForms();
    }
    if (typeof currentRoomChatKey !== "undefined") currentRoomChatKey = "";
    if (typeof requestImmediateRoomChatRefresh === "function" && !document.hidden) {
        requestImmediateRoomChatRefresh();
    }
}

function replaceRoomShellFromDocument(doc) {
    const currentShell = document.getElementById("roomLiveShell");
    const nextShell = doc.getElementById("roomLiveShell");
    if (!currentShell || !nextShell) return false;

    currentShell.replaceWith(nextShell);
    currentRoomStateKey = nextShell.dataset.roomStateKey || currentRoomStateKey;
    currentRoomStatus = nextShell.dataset.roomStatus || currentRoomStatus;
    currentRoomMode = nextShell.dataset.roomMode || currentRoomMode;
    currentSeriesPhase = nextShell.dataset.seriesPhase || currentSeriesPhase;
    rebindRoomDynamicUi();
    return true;
}

async function fetchRoomDocument(url, options) {
    const response = await fetch(url, Object.assign({
        credentials: "same-origin",
        cache: "no-store",
        headers: {"X-PES-Room-Ajax": "1"}
    }, options || {}));
    if (handleRoomSessionResponse(response)) {
        throw new Error("room_session_ended");
    }
    const text = await response.text();
    const doc = new DOMParser().parseFromString(text, "text/html");
    return {response: response, doc: doc};
}

async function refreshRoomView() {
    if (roomViewRefreshInFlight || roomStateStopped) return false;
    roomViewRefreshInFlight = true;
    try {
        const result = await fetchRoomDocument(currentRoomPath);
        if (!result.response.ok) return false;
        return replaceRoomShellFromDocument(result.doc);
    } catch (error) {
        return false;
    } finally {
        roomViewRefreshInFlight = false;
    }
}

function shouldAjaxRoomForm(form) {
    if (!form || String(form.method || "get").toLowerCase() !== "post") return false;
    if (form.classList.contains("room-exit-confirm-form") || form.classList.contains("room-chat-form")) return false;
    if (form.querySelector('input[type="file"]')) return false;
    const action = String(form.action || "");
    if (!action.includes(currentRoomPath)) return false;
    return !/(\/leave|\/forfeit|\/rematch\/decline|\/dispute|\/withdraw-dispute)(?:$|\?)/.test(action);
}

function bindRoomAjaxForms() {
    const shell = document.getElementById("roomLiveShell");
    if (!shell) return;
    shell.querySelectorAll("form").forEach(function (form) {
        if (!shouldAjaxRoomForm(form) || form.dataset.roomAjaxBound === "1") return;
        form.dataset.roomAjaxBound = "1";
        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            if (roomActionRequestInFlight) return;
            roomActionRequestInFlight = true;

            const submitter = event.submitter || form.querySelector('button[type="submit"], input[type="submit"]');
            const oldText = submitter ? submitter.textContent : "";
            if (submitter) {
                submitter.disabled = true;
                submitter.textContent = "Đang xử lý...";
            }

            try {
                if (form.classList.contains("room-score-form")) {
                    const scoreFields = Array.from(form.querySelectorAll('input[name="host_score"], input[name="guest_score"]'));
                    const invalidField = scoreFields.find(function (input) {
                        const raw = String(input.value || "").trim();
                        const value = Number(raw);
                        return raw === "" || !Number.isInteger(value) || value < 0 || value > 99;
                    });
                    if (invalidField) {
                        invalidField.focus();
                        throw new Error("invalid_room_score");
                    }
                }
                const body = new FormData(form);
                if (submitter && submitter.name && !body.has(submitter.name)) body.append(submitter.name, submitter.value || "");
                const result = await fetchRoomDocument(form.action, {method: "POST", body: body});
                const responsePath = new URL(result.response.url, window.location.origin).pathname;

                if (!responsePath.startsWith(currentRoomPath)) {
                    window.location.href = result.response.url;
                    return;
                }

                const flash = getFlashFromDocument(result.doc);
                const updated = replaceRoomShellFromDocument(result.doc);
                if (updated && form.classList.contains("room-score-form") && (!flash || flash.tone !== "danger")) {
                    clearRoomScoreDraft();
                }
                if (shouldShowRoomAjaxNotice(flash)) {
                    showRoomAjaxNotice(flash.message, flash.tone);
                }
                if (!updated && !flash) showRoomAjaxNotice("Không thể cập nhật phòng. Vui lòng thử lại sau vài giây.", "warning");
            } catch (error) {
                if (error && error.message === "invalid_room_score") {
                    showRoomAjaxNotice("Hãy nhập đủ hai tỷ số từ 0 đến 99.", "warning");
                } else {
                    showRoomAjaxNotice("Kết nối phòng đấu bị gián đoạn. Tỷ số vẫn được giữ; vui lòng thử lại.", "danger");
                }
            } finally {
                roomActionRequestInFlight = false;
                if (submitter && document.contains(submitter)) {
                    submitter.disabled = false;
                    submitter.textContent = oldText;
                }
                if (roomStateImmediateTimer) window.clearTimeout(roomStateImmediateTimer);
                roomStateImmediateTimer = window.setTimeout(requestImmediateRoomStateCheck, 1800);
            }
        });
    });
}

function checkRoomState() {
    // Không thay lại toàn bộ khung phòng trong lúc chủ phòng đang nhập tỷ số.
    // Tránh mất focus hoặc có cảm giác "không điền được" khi polling trả dữ liệu mới.
    if (roomScoreFormDirty && currentRoomStatus === "playing") {
        return Promise.resolve();
    }
    if (roomStateStopped || roomStateRequestInFlight || roomActionRequestInFlight || roomViewRefreshInFlight) {
        return Promise.resolve();
    }

    const task = function () {
        if (roomStateStopped || roomStateRequestInFlight || roomActionRequestInFlight || roomViewRefreshInFlight) {
            return Promise.resolve();
        }

        roomStateRequestInFlight = true;
        const stateUrl = new URL("{{ url_for('api_room_state', room_id=room.id) }}", window.location.origin);
        if (currentRoomStateKey) stateUrl.searchParams.set("since", currentRoomStateKey);

        return fetch(stateUrl.toString(), {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store"
        })
        .then(function (res) {
            if (handleRoomSessionResponse(res)) return null;
            const stopReason = res.headers.get("X-PES-Polling-Stop") || "";
            if (stopReason) {
                stopRoomStatePolling();
                if (["room_not_found", "room_access_ended"].includes(stopReason)) {
                    window.location.href = "{{ url_for('dashboard') }}";
                }
                return null;
            }
            if (res.status === 204 || res.status === 304) return null;
            if (!res.ok) return null;
            return res.json();
        })
        .then(async function (data) {
            if (!data || !data.ok || roomStateStopped) return;
            currentRoomStatus = data.status || currentRoomStatus;
            if (data.status === "cancelled") {
                stopRoomStatePolling();
                window.location.href = "{{ url_for('dashboard') }}";
                return;
            }
            if (data.rematch_expired) {
                stopRoomStatePolling();
                if (window.PESRoomActionModal && typeof window.PESRoomActionModal.showNotice === "function") {
                    window.PESRoomActionModal.showNotice({
                        tone: "warning",
                        icon: "⌛",
                        title: "Yêu cầu đá tiếp đã hết hạn",
                        message: "Yêu cầu đá tiếp đã hết hạn sau 60 giây. Bạn sẽ được đưa về sảnh chính.",
                        note: "VỀ SẢNH CHÍNH",
                        confirmLabel: "Về sảnh chính",
                        redirectUrl: "{{ url_for('dashboard') }}",
                        autoRedirectMs: 4500
                    });
                } else {
                    window.location.href = "{{ url_for('dashboard') }}";
                }
                return;
            }
            if (typeof data.timeout_seconds !== "undefined") {
                roomCountdownSeconds = Number(data.timeout_seconds) || 0;
                renderRoomCountdown(roomCountdownSeconds);
            }
            if (data.rematch_declined) {
                stopRoomStatePolling();
                if (!data.rematch_declined_by_me && window.PESRoomActionModal && typeof window.PESRoomActionModal.showNotice === "function") {
                    window.PESRoomActionModal.showNotice({
                        tone: "warning",
                        icon: "🚪",
                        title: "Đối thủ đã rời phòng",
                        message: "Đối thủ không muốn đá tiếp. Bạn sẽ được đưa về sảnh chính.",
                        note: "PHIÊN ĐẤU ĐÃ KẾT THÚC",
                        confirmLabel: "Về sảnh chính",
                        redirectUrl: "{{ url_for('dashboard') }}",
                        autoRedirectMs: 5000
                    });
                } else {
                    window.location.href = "{{ url_for('dashboard') }}";
                }
                return;
            }
            if (data.state_key !== currentRoomStateKey) {
                await refreshRoomView();
            }
        })
        .catch(function () {})
        .finally(function () {
            roomStateRequestInFlight = false;
        });
    };

    return window.PESNet && typeof PESNet.singleFlight === "function"
        ? PESNet.singleFlight("api:room-state:{{ room.id }}", task)
        : task();
}

function requestImmediateRoomStateCheck() {
    if (document.hidden || roomStateStopped) return;
    if (roomStateController && typeof roomStateController.runNow === "function") {
        roomStateController.runNow();
    }
}

function stopRoomStatePolling() {
    roomStateStopped = true;
    if (roomStateImmediateTimer) window.clearTimeout(roomStateImmediateTimer);
    roomStateImmediateTimer = null;
    if (roomStateController && typeof roomStateController.stop === "function") {
        roomStateController.stop();
    } else if (window.PESNet && typeof PESNet.stop === "function") {
        PESNet.stop("room-state:{{ room.id }}");
    }
    roomStateController = null;
    if (typeof stopRoomChatPolling === "function") stopRoomChatPolling();
    if (roomCountdownTimer) window.clearInterval(roomCountdownTimer);
    roomCountdownTimer = null;
}

function startRoomStatePolling() {
    roomStateStopped = false;
    if (window.PESNet && typeof PESNet.createPoller === "function") {
        roomStateController = PESNet.createPoller({
            key: "room-state:{{ room.id }}",
            task: checkRoomState,
            visibleInterval: getRoomStateInterval,
            hiddenInterval: 60000,
            runWhenHidden: false,
            immediate: false,
            jitter: 350
        });
        roomStateController.runNow();
        return;
    }

    // Dự phòng khi file pes_polling.js chưa tải được: vẫn chỉ có một timer.
    let fallbackTimer = null;
    const fallbackRun = function () {
        if (roomStateStopped) return;
        checkRoomState().finally(function () {
            if (!roomStateStopped) fallbackTimer = window.setTimeout(fallbackRun, getRoomStateInterval());
        });
    };
    fallbackTimer = window.setTimeout(fallbackRun, 300);
    roomStateController = {
        runNow: fallbackRun,
        stop: function () {
            if (fallbackTimer) window.clearTimeout(fallbackTimer);
            fallbackTimer = null;
        }
    };
}

if (window.PESRoomStateController && typeof window.PESRoomStateController.stop === "function") {
    window.PESRoomStateController.stop();
}
window.PESRoomStateController = {stop: stopRoomStatePolling, runNow: requestImmediateRoomStateCheck};

document.addEventListener("DOMContentLoaded", function () {
    rebindRoomDynamicUi();
    startRoomStatePolling();
});

</script>

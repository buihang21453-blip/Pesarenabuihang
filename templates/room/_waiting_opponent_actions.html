{% if room.status == 'waiting_ready' and not room.has_guest and (room_room_viewer_is_host or current_user.role == 'admin') %}
<div class="room-global-actions room-waiting-opponent-actions" aria-label="Hành động phòng khi chờ đối thủ">
    <a class="btn arena-btn gold room-global-action-btn" href="{{ url_for('players') }}">👥 Mời đấu</a>
    {% if system_features.get('quick_match_enabled', true) %}
    <button type="button" class="btn arena-btn green room-global-action-btn room-quick-flat"
            data-quick-match-url="{{ url_for('quick_match_invite') }}">⚡ Tìm nhanh</button>
    {% else %}
    <span class="room-global-action-spacer" aria-hidden="true"></span>
    {% endif %}
    <form class="room-exit-confirm-form" method="post" action="{{ url_for('room_leave', room_id=room.id) }}"
          data-modal-tone="warning"
          data-modal-icon="🚪"
          data-modal-title="Thoát an toàn"
          data-modal-message="Phòng hiện chưa có đối thủ. Khi bạn thoát, phòng này sẽ được đóng."
          data-modal-note="ĐÓNG PHÒNG"
          data-modal-confirm-label="Thoát và đóng phòng">
        <button class="btn arena-btn red room-global-action-btn" type="submit">⇥ Thoát phòng</button>
    </form>
</div>
{% endif %}

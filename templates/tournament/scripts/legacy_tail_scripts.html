<script>document.addEventListener('click',function(e){var b=e.target.closest('[data-time-adjust]');if(!b)return;var wrap=b.closest('.td-time-stepper');if(!wrap)return;var input=wrap.querySelector('[data-time-stepper-input]');if(!input)return;var parts=(input.value||'00:00').split(':');var mins=(parseInt(parts[0]||'0',10)*60)+parseInt(parts[1]||'0',10)+parseInt(b.dataset.timeAdjust||'0',10);mins=Math.max(0,Math.min(1439,mins));mins=Math.round(mins/30)*30;if(mins>1439)mins=1410;input.value=String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');input.dispatchEvent(new Event('change',{bubbles:true}));});</script>
<script>document.addEventListener('DOMContentLoaded',function(){var m=document.querySelector('[data-mandatory-availability-modal]');if(!m)return;m.addEventListener('click',function(e){if(e.target===m){e.preventDefault();e.stopPropagation();}});document.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();e.stopPropagation();}},true);var f=m.querySelector('input[type=checkbox],input[type=text],button');if(f)setTimeout(function(){f.focus({preventScroll:true});},80);});</script>
